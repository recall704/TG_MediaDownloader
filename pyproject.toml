[project]
name = "tg-mediadownloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "patchright>=1.58.0",
    "pyaes==1.6.1",
    "pyroaddon==1.0.6",
    "pyrogram==2.0.106",
    "pysocks==1.7.1",
    "pytest>=8.0.0",
    "requests>=2.32.5",
    "ruff>=0.15.8",
    "tgcrypto==1.2.5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "watchfiles>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501", "B027", "B023"]  # Line length handled by formatter; B027/B023 intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = [".venv", "__pycache__", "build", ".trellis"]
executionEnvironments = [{ pythonPath = "${workspaceFolder}/.venv/bin/python3" }]

[tool.pyright.languageServer]
BasedPyright = { pythonPath = "${workspaceFolder}/.venv/bin/python3", args = ["${workspaceFolder}/.venv/bin/basedpyright-langserver"] }
